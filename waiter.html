<style>
/* تصميم «ليلي»: غامق مريح للعين طول الدوام، والأزرار وردية مثل لوگو الويتر */
:root{
  --ink:#0B0E1A; --neon:#4ADE80; --saf:#FBBF24; --chili:#F87171;
  --bg:#0F1220; --card:#181C2E; --soft:#20253A; --line:#2C3250; --text:#EEF0FA; --muted:#9AA0BC;
  --btn:#FF5C7A; --btn-fg:#FFFFFF; --ok:#4ADE80;
  --hd-sub:#9AA0BC;
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif; --num:'Sora','IBM Plex Sans Arabic',system-ui,sans-serif;
  color-scheme:dark;
}
/* «إطار دوّار»: الطلب الجاهز يلفّه ضوء أخضر يدور حتى الويتر ينتبهله من بعيد (مستوحى من Spinning Border بمكتبة ThreeUI — MIT) */
@property --sb{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes sbSpin{to{--sb:360deg}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(150px + var(--sbF,0px));line-height:1.6}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hd{position:sticky;top:var(--sbH,0px);z-index:30;background:var(--ink);color:#FFFFFF;padding:10px 0;border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:10px}
.hd .t{flex:1;min-width:0}
.hd b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd small{color:var(--hd-sub);font-size:12.5px}
.hb{border:1px solid var(--line);background:var(--card);color:#FFFFFF;border-radius:12px;padding:7px 11px;font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.tab{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px;font-weight:700;font-size:15px;position:relative}
.tab.on{color:var(--btn-fg);border-color:transparent;background:linear-gradient(var(--btn),var(--btn)) padding-box,conic-gradient(from var(--sb),transparent 0 70%,#FFFFFF 85%,transparent 100%) border-box;animation:sbSpin 3.2s linear infinite}
.tab .bd{position:absolute;top:-7px;inset-inline-start:10px;background:var(--saf);color:var(--ink);border-radius:10px;min-width:22px;height:22px;font-size:12px;display:grid;place-items:center;padding:0 6px}
.lbl{font-weight:700;font-size:14px;margin:14px 0 8px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.tb{aspect-ratio:1;border:1.5px solid var(--line);background:var(--card);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--num);font-weight:800;font-size:28px;position:relative}
.tb small{font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--muted)}
.tb.busy{border-color:var(--saf)}
.tb.ready{border:2px solid transparent;background:linear-gradient(color-mix(in srgb,var(--neon) 18%,var(--card)),color-mix(in srgb,var(--neon) 18%,var(--card))) padding-box,conic-gradient(from var(--sb),transparent 0 62%,#4ADE80 78%,#ECFFF3 84%,#4ADE80 90%,transparent 100%) border-box;box-shadow:0 0 22px rgba(74,222,128,.22);animation:sbSpin 2.6s linear infinite}
.tb.ready small{color:var(--ok)}
.tb small.tt{color:var(--text);font-family:var(--num);font-size:11px;font-weight:700}
.manual{display:flex;gap:8px;margin-top:12px}
.inp{display:block;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:15px;outline:none}
.inp:focus{border-color:var(--ok)}
.go{border:none;border-radius:14px;padding:12px 18px;background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:15px}
.go.big{display:block;width:100%;padding:16px;font-size:17px;margin-top:16px}
.go:disabled{opacity:.55}
.tbar{display:flex;align-items:center;gap:10px;margin-top:12px}
.tbar .pill{background:var(--btn);color:var(--btn-fg);border-radius:999px;padding:6px 14px;font-weight:700}
.tbar button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-size:13px}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0 4px;position:sticky;top:calc(58px + var(--sbH,0px));z-index:20;background:var(--bg)}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.it{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:8px;text-align:start;position:relative}
.it:disabled{opacity:.45}
.it-img{height:90px;border-radius:12px;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;font-size:34px;margin-bottom:6px}
.it b{display:block;font-size:14.5px;line-height:1.4}
.it span{font-size:13px;color:var(--muted)}
.it .q{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--saf);color:var(--ink);border-radius:11px;min-width:24px;height:24px;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.bar{position:fixed;left:0;right:0;bottom:var(--sbF,0px);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:40;background:linear-gradient(transparent,var(--bg) 35%)}
.bar button{display:flex;align-items:center;gap:10px;width:100%;max-width:728px;margin:0 auto;border:none;border-radius:18px;padding:15px 18px;background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:16px;box-shadow:0 12px 30px rgba(10,16,13,.3)}
.bar .n{background:var(--btn-fg);color:var(--btn);border-radius:10px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;padding:0 6px}
.bar .tt{margin-inline-start:auto}
.ov{position:fixed;inset:0;background:rgba(10,16,13,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;z-index:70;max-height:90vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:19px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 13px;font-weight:600;font-size:14px}
.opt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.opt.on{border-color:var(--ok);background:color-mix(in srgb,var(--neon) 16%,var(--card))}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.qty button{width:42px;height:42px;border:none;background:none;font-size:21px;font-weight:700}
.qty b{min-width:32px;text-align:center}
.ln{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ln .b{flex:1;min-width:0}
.ln .nt{color:var(--muted);font-size:12.5px}
.ln .qty button{width:34px;height:34px;font-size:18px}
.sum{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-top:12px}
.ords{display:grid;gap:10px;margin-top:4px}
.od{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.od.ready{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--sb),transparent 0 62%,#4ADE80 78%,#ECFFF3 84%,#4ADE80 90%,transparent 100%) border-box;box-shadow:0 0 22px rgba(74,222,128,.22);animation:sbSpin 2.6s linear infinite}
.od.bad{border-color:var(--chili)}
.od-h{display:flex;align-items:center;gap:8px;font-weight:700}
.od-h .tn{font-family:var(--num);font-weight:800;font-size:20px}
.od-h .st{margin-inline-start:auto;font-size:13px;border-radius:999px;padding:3px 10px;background:var(--soft)}
.od.ready .st{background:var(--neon);color:var(--ink)}
.od-i{color:var(--muted);font-size:13px;margin-top:4px}
.od button{margin-top:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600}
/* المبلغ وأزرار الطلب: تعديل / إلغاء / تم التقديم */
.od-t{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-weight:700}
.od-t b{font-family:var(--num);font-size:17px}
.od-a{display:flex;flex-wrap:wrap;gap:6px}
.od-a button{margin-top:8px}
.od-a .sv{background:var(--neon);color:var(--ink);border-color:transparent;font-weight:800}
.od-a .cx{color:var(--chili);border-color:rgba(248,113,113,.5)}
.od-a button:disabled{opacity:.45}
.od-w{margin-top:8px;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;background:rgba(251,191,36,.12);color:var(--saf);border:1px solid rgba(251,191,36,.4)}
.od-x{margin-top:8px;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;background:rgba(248,113,113,.1);color:var(--chili);border:1px solid rgba(248,113,113,.4)}
.od-ok{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--neon)}
.tbar .pill.ed{background:var(--saf);color:var(--ink)}
.edn{border-radius:14px;padding:8px 12px;margin-top:10px;font-size:13px;font-weight:600;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:var(--saf)}
.sum.big{font-size:19px}
.sum small{color:var(--muted);font-weight:600;font-size:13px}
.sum-l{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
/* بدون نت: شريط صغير يوضح وين تروح الطلبات */
.net{margin:10px 0 0;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:600;line-height:1.6;background:var(--soft);border:1px solid var(--line)}
.net.ok{border-color:rgba(74,222,128,.45);color:var(--neon)}
.net.wait{border-color:rgba(251,191,36,.45);color:var(--saf)}
.lanst{display:block;font-size:11.5px;font-weight:700;margin-top:2px}
.lanst.ok{color:var(--neon)}
.lanst.wait{color:var(--saf)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-16px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:90;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* الخدمة موقوفة من الإدارة */
.offw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.offc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center;max-width:420px}
.offc b{display:block;font-size:48px}.offc h2{font-size:21px;margin:8px 0 6px}.offc p{color:var(--muted);line-height:1.8;font-size:14.5px}
.offc button{margin-top:14px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 20px;font-weight:700}
/* تثبيت التطبيق */
.inst{position:fixed;inset:calc(10px + env(safe-area-inset-top)) 10px auto 10px;z-index:150;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px;
  background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:12px 12px 12px 10px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:instIn .3s ease}
@keyframes instIn{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.inst img{width:46px;height:46px;border-radius:12px;flex:none}
.inst-t{flex:1;min-width:0;line-height:1.5}
.inst-t b{display:block;font-size:15.5px}
.inst-t span{display:block;font-size:12.5px;color:var(--muted)}
.inst-t span b{display:inline;font-size:inherit;color:var(--text)}
.inst-go{flex:none;border:none;border-radius:12px;background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:15px;padding:10px 16px}
.inst-x{flex:none;border:none;background:none;color:var(--muted);font-size:18px;padding:4px 6px}
/* شاشة الربط (ستايلها المشترك من staff.js): لوگو الويتر الوردي وإطار الرمز بنفس اللون */
#gate .gate-logo{background:var(--btn);color:var(--btn-fg)}
#gate .pair-code{border-color:var(--btn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
// ── تثبيت تطبيق الويتر: أول ما ينفتح الرابط يطلب التثبيت (منفصل عن Firebase حتى يشتغل حتى بدون نت) ──
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true || /SoraWaiterApp\//.test(navigator.userAgent || '');
  var ua = navigator.userAgent || '';
  var ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var mobile = ios || /android|mobile/i.test(ua);
  var deferred = null;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('waiter-sw.js', { scope: './waiter' }).catch(function () {});
  function closed() { try { return sessionStorage.getItem('w_inst_x') === '1'; } catch (e) { return false; } }
  function show(mode) {
    if (standalone || closed()) return;
    $('inst').hidden = false;
    $('instGo').hidden = mode !== 'prompt';
    if (mode === 'ios') $('instSub').innerHTML = 'اضغط زر المشاركة <b>⬆️</b> وبعدها «<b>إضافة إلى الشاشة الرئيسية</b>»';
    else if (mode === 'menu') $('instSub').innerHTML = 'من قائمة المتصفح <b>⋮</b> اختار «<b>تثبيت التطبيق</b>» أو «<b>إضافة للشاشة الرئيسية</b>» — وإذا فتحته من واتساب اختار «فتح في Chrome» أول';
    else $('instSub').textContent = 'يفتح بضغطة من الشاشة الرئيسية، مثل أي تطبيق';
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; show('prompt'); });
  window.addEventListener('appinstalled', function () {
    $('inst').hidden = true; deferred = null;
    var t = $('toast'); if (t) { t.textContent = '✅ انثبت — افتح «الويتر» من الشاشة الرئيسية'; t.classList.add('on'); setTimeout(function () { t.classList.remove('on'); }, 3000); }
  });
  $('instGo').onclick = function () {
    if (!deferred) return;
    deferred.prompt();
    Promise.resolve(deferred.userChoice).then(function (r) { if (r && r.outcome === 'accepted') $('inst').hidden = true; }).catch(function () {});
    deferred = null;
  };
  $('instX').onclick = function () { $('inst').hidden = true; try { sessionStorage.setItem('w_inst_x', '1'); } catch (e) {} };
  // المتصفح ما عرض التثبيت (آيفون، أو متصفح ثاني، أو فاتحه من واتساب): نشرحله شلون
  if (!standalone && mobile) setTimeout(function () {
    if (deferred || !$('inst').hidden) return;
    var check = navigator.getInstalledRelatedApps ? navigator.getInstalledRelatedApps().catch(function () { return []; }) : Promise.resolve([]);
    check.then(function (apps) { if (!apps || !apps.length) show(ios ? 'ios' : 'menu'); });
  }, ios ? 800 : 3500);
})();
</script>

document.getElementById('gateCss').textContent = GATE_CSS;

const money = (n) => Math.round(n || 0).toLocaleString('en-US') + ' د.ع';
const digits = (s) => String(s || '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const safeImg = (u) => typeof u === 'string' && /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(u);

  const open = mine.filter((w) => w.table === table && (!edit || w.id !== edit.id) && !['done', 'cancelled', 'rejected'].includes(stOf(w))).reduce((s, w) => s + (Number(w.total) || 0), 0);
  $('cartSh').innerHTML = `<div class="grab"></div><h3>${edit ? '✏️ تعديل طلب طاولة ' : '🪑 طاولة '}${esc(table)}</h3>
    ${cart.map((c, i) => `<div class="ln"><div class="b"><b>${esc(c.name)}${c.variant && c.variant !== 'وحدة' ? ' — ' + esc(c.variant) : ''}</b><div class="nt">${money(c.price * c.qty)}${c.note ? ' • 📝 ' + esc(c.note) : ''}</div></div>
      <div class="qty"><button type="button" data-l="${i}" data-d="-1">−</button><b>${c.qty}</b><button type="button" data-l="${i}" data-d="1">+</button></div></div>`).join('')}
    ${edit ? '' : `<div class="lbl">ملاحظة للطلب</div><input class="inp" id="cNote" maxlength="200" value="${esc(note)}" placeholder="مثال: الطاولة مستعجلة">`}
    ${edit ? `<div class="sum-l"><span>المبلغ قبل التعديل</span><span>${money(edit.total)}</span></div>` : ''}
    <div class="sum${open ? '' : ' big'}"><span>${edit ? 'المبلغ بعد التعديل' : 'مبلغ هذا الطلب'}</span><span>${money(total())}</span></div>
    ${open ? `<div class="sum-l"><span>طلبات الطاولة الثانية المفتوحة</span><span>${money(open)}</span></div><div class="sum big"><span>💰 المبلغ الكلي للطاولة</span><span id="cGrand">${money(open + total())}</span></div>` : ''}
    <button type="button" class="go big" id="cSend"${sending ? ' disabled' : ''}>${sending ? '⏳ جاري الإرسال…' : edit ? '💾 حفظ التعديل' : '📨 إرسال للمطبخ'}</button>`;
}
$('cartSh').addEventListener('click', (e) => {
  const l = e.target.closest('[data-l]');
  if (l) { const c = cart[+l.dataset.l]; c.qty += +l.dataset.d; if (c.qty <= 0) cart.splice(+l.dataset.l, 1); renderMenu(); renderBar(); if (!cart.length) close_(); else renderCart(); return; }
  if (e.target.id === 'cSend') send();
});
const lines = () => cart.map((c) => (c.note ? { name: c.name, variant: c.variant, price: c.price, qty: c.qty, note: c.note } : { name: c.name, variant: c.variant, price: c.price, qty: c.qty }));
async function send() {
  if (sending || !cart.length || !table) return;
  if (edit) {
    const w = mine.find((x) => x.id === edit.id);
    if (!w) { toast('⚠️ الطلب مو موجود'); return; }
    sending = true; renderCart();
    const ok = await sendReq(w, 'edit', lines());
    sending = false;
    if (!ok) { renderCart(); return; }
    edit = null; cart = []; table = ''; tbarUi(); close_(); show('orders');
    return;
  }
  const note = $('cNote').value.trim();
  const ref = doc(collection(db, 'webOrders'));
  const data = { restaurantId: me.rid, source: 'waiter', mode: 'table', table: String(table).slice(0, 10), status: 'new', createdAtMs: Date.now(), day: bagDay(),
    waiter: String(me.name || 'الويتر').slice(0, 60), waiterUid: me.uid, total: total(), items: lines() };
  if (note) data.note = note.slice(0, 500);
  sending = true; renderCart();
  const t = table;
  // بنفس الوقت: السيرفر (ينحفظ بالتلفون ويترفع وحده من يرجع النت) + الكاشير على الواي فاي مباشرة — نفس المعرّف، فما يتكرر
  const fsP = setDoc(ref, data).then(() => 'ok', (e) => e.code || 'err');
  const lanP = lan.on() ? lan.actAll('order', { w: { ...data, id: ref.id } }, 5000) : Promise.resolve(false);
  if (lan.on()) { lanTried.set(ref.id, Date.now()); lanP.then((ok) => { if (ok) lanOk.add(ref.id); }); }
  const res = await new Promise((done) => {
    let left = 2;
    const miss = () => { if (--left === 0) done('queued'); };
    fsP.then((r) => (r === 'ok' ? done('ok') : r === 'permission-denied' ? done('denied') : miss()));
    lanP.then((ok) => (ok ? done('lan') : miss()));
    setTimeout(() => done('queued'), 2500);
  });
  sending = false;
  if (res === 'denied') { renderCart(); toast('⛔ ما ينقبل — الخدمة موقوفة أو خارج وقت دوامك'); return; }
  toast(res === 'queued' ? '📥 انحفظ طلب طاولة ' + t + ' — يوصل للكاشير أول ما يرجع النت' : '📨 انرسل طلب طاولة ' + t);
  cart = []; table = ''; close_(); show('orders');
  // رفض متأخر من السيرفر (بعد ما رجع النت)
  fsP.then((r) => { if (r === 'permission-denied' && res !== 'denied' && !lan.orders().has(ref.id)) toast('⛔ طلب طاولة ' + t + ' ما انقبل — الخدمة موقوفة أو خارج وقت الدوام'); });
}

// ── طلباتي ──
const RQ = { edit: '✏️ التعديل', cancel: '❌ الإلغاء', served: '✅ «تم التقديم»' };
function renderOrders() {
  $('ords').innerHTML = mine.length ? mine.map((w) => {
    const s = stOf(w), cls = s === 'ready' ? 'ready' : ['rejected', 'cancelled'].includes(s) ? 'bad' : '';
    const mins = Math.max(0, Math.floor((Date.now() - (w.createdAtMs || 0)) / 60000));
    const pr = pendReq(w), lr = lastReq(w), live = !['done', 'rejected', 'cancelled'].includes(s), dis = pr ? ' disabled' : '', id = esc(w.id);
    const res = !pr && lr && w.reqDone === lr.id ? (w.reqRes === 'ok' ? (lr.type === 'edit' ? '<div class="od-ok">✏️ انعدّل — المطبخ شاف التغيير</div>' : '')
      : `<div class="od-x">⛔ ${RQ[lr.type] || 'الطلب'} ما انقبل: ${esc(w.reqReason || 'راجع الكاشير')}</div>`) : '';
    return `<div class="od ${cls}" data-id="${id}"><div class="od-h"><span class="tn">🪑 ${esc(w.table)}</span>${w.ticket ? `<span>#${esc(w.ticket)}</span>` : ''}<span class="st">${ST[s] || s}</span></div>
      <div class="od-i">${(w.items || []).map((i) => `${i.qty}× ${esc(i.name)}${i.variant && i.variant !== 'وحدة' ? ' (' + esc(i.variant) + ')' : ''}`).join('، ')} • قبل ${mins} د</div>
      ${s === 'rejected' && w.reason ? `<div class="od-i">السبب: ${esc(w.reason)}</div>` : ''}
      <div class="od-t"><span>💰 المبلغ</span><b>${money(w.total)}</b></div>
      ${pr ? `<div class="od-w">⏳ ${RQ[pr.type] || 'الطلب'} بانتظار الكاشير…</div>` : res}
      ${live ? `<div class="od-a">
        ${s === 'ready' ? `<button type="button" class="sv" data-act="served" data-id="${id}"${dis}>✅ تم التقديم</button>` : ''}
        <button type="button" data-act="edit" data-id="${id}"${dis}>✏️ تعديل</button>
        ${s !== 'ready' ? `<button type="button" class="cx" data-act="cancel" data-id="${id}"${dis}>❌ إلغاء</button>` : ''}
        <button type="button" data-more="${esc(w.table)}">➕ طلب جديد للطاولة</button></div>` : ''}</div>`;
  }).join('') : '<div class="empty">ماكو طلبات اليوم بعد — اختار طاولة وابدأ</div>';
}
$('ords').addEventListener('click', (e) => {
  const b = e.target.closest('[data-more]'); if (b) { pickTable(b.dataset.more); return; }
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const w = mine.find((x) => x.id === a.dataset.id); if (!w || pendReq(w)) return;
  if (a.dataset.act === 'edit') return startEdit(w);
  if (a.dataset.act === 'cancel') { if (confirm('تلغي طلب طاولة ' + w.table + '؟\nالمطبخ يشوف إنه انلغى.')) sendReq(w, 'cancel'); return; }
  if (a.dataset.act === 'served') sendReq(w, 'served');
});
// تعديل طلب: السلة تنملي بأصنافه (السعر من الطلب، أو من المنيو إذا ما موجود)
function startEdit(w) {
  if (cart.length && !confirm('عندك أصناف ما انرسلت لطاولة ' + table + ' — تمسحها وتعدّل هذا الطلب؟')) return;
  const price = (i) => { if (Number(i.price) > 0) return Number(i.price); for (const c of cats) for (const p of c.items || []) if (p.name === i.name) { const v = (p.variants || []).find((x) => x.name === i.variant) || (p.variants || [])[0]; if (v) return Number(v.price) || 0; } return 0; };
  cart = (w.items || []).slice(0, 40).map((i) => ({ name: i.name, variant: i.variant || '', price: price(i), qty: Math.max(1, Math.min(99, Number(i.qty) || 1)), note: i.note || '' }));
  edit = { id: w.id, table: w.table, total: Number(w.total) || cart.reduce((s, c) => s + c.price * c.qty, 0) };
  table = w.table; $('q').value = '';
  tbarUi(); show('menu');
}
// يرسل الطلب للكاشير: على السيرفر (ينحفظ بالتلفون ويترفع من يرجع النت) + على الواي فاي مباشرة — الكاشير يطبّقه مرة وحدة
async function sendReq(w, type, items) {
  const r = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), type, atMs: Date.now() };
  if (items) r.items = items;
  reqPend.set(w.id, r); renderOrders();
  const fsP = updateDoc(doc(db, 'webOrders', w.id), { req: r }).then(() => 'ok', (e) => e.code || 'err');
  const lanP = lan.on() ? lan.actAll('req', { id: w.id, req: r }, 6000) : Promise.resolve(false);
  const res = await new Promise((done) => {
    let left = 2;
    const miss = () => { if (--left === 0) done('queued'); };
    fsP.then((x) => (x === 'ok' ? done('ok') : x === 'permission-denied' ? done('denied') : miss()));
    lanP.then((ok) => (ok ? done('lan') : miss()));
    setTimeout(() => done('queued'), 2500);
  });
  if (res === 'denied') { if (reqPend.get(w.id) === r) reqPend.delete(w.id); renderOrders(); toast('⛔ ما ينقبل — الطلب انقفل أو الخدمة موقوفة'); return false; }
  const T = { edit: 'التعديل', cancel: 'طلب الإلغاء', served: '«تم التقديم»' }[type];
  toast(res === 'queued' ? '📥 ' + T + ' انحفظ — يوصل للكاشير أول ما يرجع النت' : '📨 ' + T + ' وصل للكاشير');
  fsP.then((x) => { if (x === 'permission-denied' && res !== 'denied' && reqPend.get(w.id) === r) { reqPend.delete(w.id); renderOrders(); toast('⛔ ' + T + ' لطاولة ' + w.table + ' ما انقبل'); } });
  return true;
}
setInterval(() => { if (me && !$('vOrders').hidden) renderOrders(); }, 30000);

function beep() {
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(), o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 1046;
    g.gain.setValueAtTime(.0001, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.3, ctx.currentTime + .03); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .4); o.start(); o.stop(ctx.currentTime + .45); } catch (e) {}
}
function open_(id) { $('ov').classList.add('on'); $(id).classList.add('on'); }
function close_() { $('ov').classList.remove('on'); document.querySelectorAll('.sheet').forEach((s) => s.classList.remove('on')); }
$('ov').onclick = close_;
</script>
</body>
</html>
