plugins { id 'com.android.application' }

android {
    namespace 'iq.sora3a.cashier'
    compileSdk 34
    defaultConfig {
        applicationId 'iq.sora3a.cashier'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }
    buildFeatures { buildConfig true }
    // أربع تطبيقات من نفس الكود: الكاشير (بيع + طباعة)، خط المطعم (يبعث رقم المتصل بس)، الشاشة (طلبك جاهز على التلفزيون)،
    // وشاشة المطبخ/المجهز (تشتغل بنت أو بدون نت على نفس الراوتر ويا الكاشير)
    flavorDimensions 'app'
    productFlavors {
        cashier {
            dimension 'app'
            applicationId 'iq.sora3a.cashier'
            buildConfigField 'boolean', 'LINE', 'false'
            buildConfigField 'boolean', 'SCREEN', 'false'
            buildConfigField 'boolean', 'KITCHEN', 'false'
            buildConfigField 'String', 'START_URL', '"https://qaesartools-web.github.io/sora3a-rest2/"'
        }
        line {
            dimension 'app'
            applicationId 'iq.sora3a.line'
            buildConfigField 'boolean', 'LINE', 'true'
            buildConfigField 'boolean', 'SCREEN', 'false'
            buildConfigField 'boolean', 'KITCHEN', 'false'
            buildConfigField 'String', 'START_URL', '"https://qaesartools-web.github.io/sora3a-rest2/line.html"'
        }
        screen {
            dimension 'app'
            applicationId 'iq.sora3a.screen'
            buildConfigField 'boolean', 'LINE', 'false'
            buildConfigField 'boolean', 'SCREEN', 'true'
            buildConfigField 'boolean', 'KITCHEN', 'false'
            buildConfigField 'String', 'START_URL', '"https://qaesartools-web.github.io/sora3a-rest2/screen.html"'
        }
        kitchen {
            dimension 'app'
            applicationId 'iq.sora3a.kitchen'
            buildConfigField 'boolean', 'LINE', 'false'
            buildConfigField 'boolean', 'SCREEN', 'false'
            buildConfigField 'boolean', 'KITCHEN', 'true'
            buildConfigField 'String', 'START_URL', '"https://qaesartools-web.github.io/sora3a-rest2/kitchen.html"'
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'none.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias 'sora3a'
            keyPassword System.getenv('KEYSTORE_PASS') ?: ''
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    // JSON حقيقي للاختبارات (نسخة الأندرويد بالاختبارات فارغة) — شبكة المطعم
    testImplementation 'org.json:json:20231013'
}
