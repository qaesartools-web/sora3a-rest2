plugins { id 'com.android.application' }

android {
    namespace 'iq.sora3a.cashier'
    compileSdk 34
    defaultConfig {
        applicationId 'iq.sora3a.cashier'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'none.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias 'sora3a'
            keyPassword System.getenv('KEYSTORE_PASS') ?: ''
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
