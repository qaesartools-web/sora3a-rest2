# يبني أربع تطبيقات للأندرويد من نفس الكود — روابط تنزيل ثابتة:
#   الكاشير:    releases/download/cashier-android/sora3a-cashier.apk
#   خط المطعم:  releases/download/line-android/sora3a-line.apk
#   الشاشة:     releases/download/screen-android/sora3a-screen.apk  (تلفزيون / تيفي بوكس)
#   المطبخ:     releases/download/kitchen-android/sora3a-kitchen.apk (شاشة المطبخ/المجهز — بنت أو بدون نت ويا الكاشير)
# (ما يصيرون «latest» حتى ما يأثرون على تحديث برنامج الحاسبة)
name: Android cashier app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-cashier.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-cashier.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      # مفتاح التوقيع: ثابت من سرّ SIGN_SEED (كل نسخة تنصب فوق القديمة، والتطبيق يحدّث نفسه)،
      # وإذا السرّ مو موجود (مثلاً PR من fork) مفتاح مؤقت لهالبناء بس — والتحديث من داخل التطبيق يبقى مطفي
      - name: Signing key
        env: { SIGN_SEED: '${{ secrets.SIGN_SEED }}' }
        run: |
          P=$(openssl rand -hex 16); echo "::add-mask::$P"
          K="$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PASS=$P" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$K" >> "$GITHUB_ENV"
          if [ -n "$SIGN_SEED" ]; then
            python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install --quiet cryptography
            CERT=$(KEYSTORE_PASS="$P" "$RUNNER_TEMP/py/bin/python" tools/signkey.py "$K")
            echo "SIGN_CERT=$CERT" >> "$GITHUB_ENV"
            echo "🔑 التوقيع ثابت — بصمة الشهادة: \`$CERT\`" >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -storetype PKCS12 -keystore "$K" -storepass "$P" -keypass "$P" -alias sora3a -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sora3a Cashier"
            echo "SIGN_CERT=" >> "$GITHUB_ENV"
            echo "⚠️ التوقيع مؤقت (ماكو SIGN_SEED) — التحديث من داخل التطبيق مطفي" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Unit tests + build
        working-directory: android
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle --no-daemon testCashierDebugUnitTest assembleCashierRelease assembleLineRelease assembleScreenRelease assembleKitchenRelease
      - run: |
          cp android/app/build/outputs/apk/cashier/release/app-cashier-release.apk sora3a-cashier.apk
          cp android/app/build/outputs/apk/line/release/app-line-release.apk sora3a-line.apk
          cp android/app/build/outputs/apk/screen/release/app-screen-release.apk sora3a-screen.apk
          cp android/app/build/outputs/apk/kitchen/release/app-kitchen-release.apk sora3a-kitchen.apk
          # التطبيق يقرا هذا الملف حتى يعرف أكو نسخة أحدث، ويحدّث نفسه بس إذا بصمة التوقيع نفسها
          printf '{"version":%s,"name":"1.%s","cert":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "$SIGN_CERT" > version.json
      # تطبيق المطبخ: أيقونتين (المطبخ فيروزي / المجهز بنفسجي) ووحدة بس شغّالة — والكاشير أيقونة وحدة مثل قبل
      - name: Check launcher icons
        run: |
          A=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          n() { "$A" dump xmltree --file AndroidManifest.xml "$1" | grep -c '"android.intent.category.LAUNCHER"' || true; }
          "$A" dump xmltree --file AndroidManifest.xml sora3a-kitchen.apk | grep -E 'E: activity|activity-alias|A: .*(name|enabled|targetActivity|label|icon)\(' | head -40
          test "$(n sora3a-kitchen.apk)" = 2
          test "$(n sora3a-cashier.apk)" = 1
          test "$(n sora3a-line.apk)" = 1
      - uses: actions/upload-artifact@v4
        with: { name: sora3a-android-apks, path: 'sora3a-*.apk' }
      - name: Publish (fixed tag, not latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cashier-android
          name: تطبيق الكاشير للأندرويد
          make_latest: false
          body: نسخة ${{ github.run_number }} — نزّل sora3a-cashier.apk وثبّته على جهاز الكاشير أو التابلت. (لربط رقم المطعم استخدم تطبيق «خط المطعم».)
          files: |
            sora3a-cashier.apk
            version.json
      - name: Publish line app (fixed tag, not latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: line-android
          name: تطبيق خط المطعم للأندرويد
          make_latest: false
          body: نسخة ${{ github.run_number }} — نزّل sora3a-line.apk وثبّته على التلفون اللي بيه شريحة المطعم أو واتساب المطعم، سجّل دخول بحساب صاحب المطعم واكتب الرقم. رقم المتصل يطلع بالكاشير.
          files: |
            sora3a-line.apk
            version.json
      - name: Publish screen app (fixed tag, not latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screen-android
          name: تطبيق الشاشة «طلبك جاهز» للتلفزيون
          make_latest: false
          body: نسخة ${{ github.run_number }} — نزّل sora3a-screen.apk وثبّته على التيفي بوكس أو التلفزيون أندرويد أو التابلت. سجّل دخول مرة وحدة، والشاشة تفتح وحدها مع تشغيل الجهاز.
          files: |
            sora3a-screen.apk
            version.json
      - name: Publish kitchen app (fixed tag, not latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kitchen-android
          name: تطبيق شاشة المطبخ والمجهز للأندرويد
          make_latest: false
          body: نسخة ${{ github.run_number }} — نزّل sora3a-kitchen.apk وثبّته على تابلت المطبخ أو المجهز واربطه بالرمز من لوحة الإدارة. يشتغل بنت أو بدون نت ما دام على نفس الواي فاي ويا الكاشير.
          files: |
            sora3a-kitchen.apk
            version.json
