<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلبك جاهز — شاشة المطعم</title>
<meta name="theme-color" content="#0A100D">
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Reem+Kufi:wght@600;700&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A100D; --neon:#3DF08B; --neon2:#22C96B; --saf:#FFB627;
  --bg:#0A100D; --card:#121A15; --card2:#17221B; --line:#24342B; --text:#F1EFE8; --muted:#8E978F;
  --font:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif; --kufi:'Reem Kufi','IBM Plex Sans Arabic',sans-serif; --num:'Sora','IBM Plex Sans Arabic',system-ui,sans-serif;
}
/* الشاشة داكنة دائماً (تلفزيون بالمطعم)، والوضع الفاتح للتابلت عند الطلب (?theme=light) */
:root[data-theme="light"]{--bg:#F4F1E8; --card:#FFFFFF; --card2:#FBF9F3; --line:#E3DCCB; --text:#0A100D; --muted:#676C64}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);overflow:hidden;
  background:#0A100D;
  background:radial-gradient(900px 520px at 88% -8%,rgba(61,240,139,.13),transparent 62%),radial-gradient(800px 480px at -5% 108%,rgba(255,182,39,.07),transparent 60%),var(--bg)}
:root[data-theme="light"] body{background:radial-gradient(900px 520px at 88% -8%,rgba(61,240,139,.18),transparent 62%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus{outline:3px solid var(--neon);outline-offset:3px}

.scr{height:100vh;height:100dvh;display:flex;flex-direction:column}

/* ── الرأس ── */
.top{display:flex;align-items:center;padding:16px 28px;padding:clamp(10px,1.6vw,22px) clamp(16px,2.4vw,40px)}
.top>*+*{margin-inline-start:16px}
.mk{flex:none;width:52px;height:52px;width:clamp(38px,4vw,64px);height:clamp(38px,4vw,64px);border-radius:16px;
  background:linear-gradient(145deg,#5BFFA5,#22C96B);color:#0A100D;display:flex;align-items:center;justify-content:center;
  font-family:var(--kufi);font-weight:700;font-size:28px;font-size:clamp(20px,2.2vw,36px);box-shadow:0 10px 30px rgba(61,240,139,.25)}
.nmw{flex:1;min-width:0}
.nm{font-family:var(--kufi);font-size:30px;font-size:clamp(20px,2.6vw,42px);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-flex;align-items:center;font-size:13px;font-size:clamp(11px,1vw,16px);color:var(--muted);font-weight:600}
.live i{width:9px;height:9px;border-radius:50%;background:var(--neon);margin-inline-end:7px;box-shadow:0 0 0 0 rgba(61,240,139,.6);animation:dot 2s ease-out infinite}
@keyframes dot{70%{box-shadow:0 0 0 9px rgba(61,240,139,0)}100%{box-shadow:0 0 0 0 rgba(61,240,139,0)}}
.when{text-align:left;flex:none}
.clk{font-family:var(--num);font-weight:800;font-size:34px;font-size:clamp(22px,3vw,52px);line-height:1;letter-spacing:.5px}
.dt{font-size:13px;font-size:clamp(11px,1vw,17px);color:var(--muted);margin-top:4px}
.mb{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:20px;display:flex;align-items:center;justify-content:center;position:relative}
.mb small{position:absolute;bottom:-4px;left:-4px;font-size:13px}

/* ── العمودين ── */
.cols{flex:1;min-height:0;display:flex;padding:0 28px;padding:0 clamp(16px,2.4vw,40px)}
.col{min-height:0;display:flex;flex-direction:column;border-radius:28px;padding:20px;padding:clamp(14px,1.8vw,30px)}
.ready{flex:1.6;background:linear-gradient(180deg,rgba(61,240,139,.08),rgba(61,240,139,.02));border:1px solid rgba(61,240,139,.28)}
.prep{flex:1;margin-inline-start:20px;background:var(--card);border:1px solid var(--line)}
.hd{display:flex;align-items:center;margin-bottom:16px;margin-bottom:clamp(10px,1.4vw,22px)}
.hd h2{font-family:var(--kufi);font-weight:700;font-size:28px;font-size:clamp(20px,2.5vw,42px);line-height:1.2;flex:1}
.ready .hd h2{color:var(--neon)}
.prep .hd h2{color:var(--text)}
.badge{flex:none;width:44px;height:44px;width:clamp(32px,3.4vw,56px);height:clamp(32px,3.4vw,56px);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-inline-end:12px;font-size:22px;font-size:clamp(16px,1.8vw,28px)}
.ready .badge{background:var(--neon);color:#0A100D;box-shadow:0 0 0 8px rgba(61,240,139,.12)}
.prep .badge{background:var(--card2);border:1px solid var(--line)}
.cnt{flex:none;font-family:var(--num);font-weight:800;font-size:18px;font-size:clamp(13px,1.4vw,24px);padding:4px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.ready .cnt{background:rgba(61,240,139,.14);border-color:rgba(61,240,139,.35);color:var(--neon)}

/* ── الأرقام ── */
.nums{flex:1;min-height:0;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;margin:0 -10px 0 -24px;padding:10px 10px 12px 10px}
.n{position:relative;margin:0 0 14px 14px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--num);font-weight:800;line-height:1;text-align:center}
.n .h{opacity:.45;font-size:.6em;margin-inline-end:2px}
.n .pg{display:block;font-family:var(--font);font-weight:700;font-size:15px;font-size:clamp(11px,1.15vw,20px);margin-top:8px;opacity:.85}
.n[data-t]::after{content:attr(data-t);font-family:var(--font);font-weight:700;font-size:12px;font-size:clamp(10px,.95vw,16px);margin-top:6px;padding:3px 10px;border-radius:999px}

.ready .n{background:linear-gradient(160deg,#63FFAA,#24CF6E);color:#0A100D;font-size:64px;font-size:clamp(44px,6vw,108px);min-width:170px;min-width:clamp(120px,13vw,240px);padding:22px 20px;padding:clamp(14px,1.6vw,28px) clamp(14px,1.6vw,26px);box-shadow:0 8px 22px rgba(34,201,107,.2),inset 0 1px 0 rgba(255,255,255,.45)}
.ready .n[data-t]::after{background:rgba(10,16,13,.12)}
/* آخر طلب جاهز: بطاقة كبيرة بالأعلى */
.ready .n.feat{width:calc(100% - 14px);font-size:150px;font-size:clamp(96px,13vw,250px);padding:28px 20px 24px;padding:clamp(18px,2vw,34px) 20px;border-radius:30px}
.ready .n.feat::before{content:'🔔 آخر طلب جاهز';font-family:var(--font);font-weight:700;font-size:18px;font-size:clamp(13px,1.4vw,24px);margin-bottom:10px;opacity:.7}
.ready .n.feat .pg{font-size:20px;font-size:clamp(14px,1.6vw,28px)}
.ready .n.new{animation:pop 1s ease-in-out 6}
@keyframes pop{50%{transform:scale(1.03);box-shadow:0 0 0 8px rgba(61,240,139,.25),0 8px 22px rgba(34,201,107,.3)}}

.prep .n{background:var(--card2);border:1px solid var(--line);color:var(--text);font-size:44px;font-size:clamp(30px,3.6vw,64px);min-width:120px;min-width:clamp(90px,8.5vw,160px);padding:16px 14px 20px;padding:clamp(12px,1.2vw,20px) clamp(10px,1vw,16px) clamp(16px,1.5vw,24px);overflow:hidden}
.prep .n[data-t]::after{background:var(--card);color:var(--muted)}
/* شريط «يتحضر» يتحرك أسفل كل بطاقة */
.prep .n::before{content:'';position:absolute;bottom:0;right:0;left:0;height:4px;background:linear-gradient(90deg,transparent,var(--saf),transparent);background-size:200% 100%;animation:cook 2.4s linear infinite;opacity:.8}
@keyframes cook{from{background-position:200% 0}to{background-position:-200% 0}}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;margin:0 0 0 14px;padding:30px 10px;color:var(--muted);font-size:20px;font-size:clamp(14px,1.7vw,28px);text-align:center}
.empty b{font-size:54px;font-size:clamp(36px,5vw,84px);margin-bottom:10px;opacity:.85}

/* ── الأسفل ── */
.foot{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;padding:clamp(10px,1.2vw,18px) clamp(16px,2.4vw,40px);color:var(--muted);font-size:15px;font-size:clamp(11px,1.15vw,19px)}
.foot b{color:var(--neon)}
.foot .tip{display:flex;align-items:center}
.foot .tip i{font-style:normal;width:30px;height:30px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;margin-inline-end:10px}

/* ── قائمة الإعدادات (تشتغل بالريموت) ── */
.menu{position:fixed;top:84px;left:24px;z-index:30;width:300px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.menu .mt{font-size:13px;color:var(--muted);padding:4px 8px 10px}
.menu button{display:block;width:100%;text-align:start;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:13px 14px;font-size:17px;font-weight:600;margin-top:8px}
.menu button.warn{border-color:#FF4D2E;color:#FF8A70}
.menu .hintk{font-size:12px;color:var(--muted);padding:10px 8px 2px;line-height:1.7}
.hint{position:fixed;right:50%;bottom:80px;transform:translateX(50%);background:var(--saf);color:var(--ink);border:none;border-radius:16px;padding:13px 20px;font-weight:700;font-size:16px;z-index:20;box-shadow:0 14px 40px rgba(0,0,0,.4)}

@media (max-width:760px){
  body{overflow:auto}.scr{height:auto;min-height:100vh}
  .cols{flex-direction:column}.prep{margin:16px 0 0}.ready .n.feat{font-size:96px}
  .dt,.live{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
<style id="gateCss"></style>
</head>
<body>
<div class="gate" id="gate" hidden></div>
<div class="scr" id="scr" hidden>
  <header class="top">
    <div class="mk" id="mk">س</div>
    <div class="nmw"><div class="nm" id="nm"></div><div class="live"><i></i>مباشر — يتحدث وحده</div></div>
    <div class="when"><div class="clk" id="clk"></div><div class="dt" id="dt"></div></div>
    <button type="button" class="mb" id="menuBtn" title="الإعدادات" aria-label="الإعدادات">⚙️<small id="sndIco">🔊</small></button>
  </header>
  <main class="cols">
    <section class="col ready">
      <div class="hd"><span class="badge">✓</span><h2>جاهز — تفضل استلم</h2><span class="cnt" id="rdN">0</span></div>
      <div class="nums" id="ready"></div>
    </section>
    <section class="col prep">
      <div class="hd"><span class="badge">👨‍🍳</span><h2>قيد التحضير</h2><span class="cnt" id="ppN">0</span></div>
      <div class="nums" id="prep"></div>
    </section>
  </main>
  <footer class="foot"><span class="tip"><i>🧾</i>رقم طلبك على الفاتورة أو البيجر — أول ما يصير أخضر تفضل استلمه</span><span>مدعوم من <b>سرعة</b></span></footer>
</div>
<div class="menu" id="menu" hidden role="dialog" aria-label="الإعدادات">
  <div class="mt">⚙️ إعدادات الشاشة</div>
  <button type="button" id="mSnd"></button>
  <button type="button" id="mReload">🔄 تحديث الشاشة</button>
  <button type="button" id="fsBtn">⛶ ملء الشاشة</button>
  <button type="button" id="mOut">🚪 تسجيل خروج</button>
  <button type="button" id="mClose">✕ رجوع</button>
  <div class="hintk">بالريموت: ⬆️⬇️ للتنقل و OK للاختيار</div>
</div>
<button type="button" class="hint" id="hint" hidden>🔊 اضغط هنا حتى يشتغل صوت التنبيه</button>

<script type="module">
import { db, staffGate, logout, esc, bagDay, GATE_CSS, collection, query, where, onSnapshot, doc } from './staff.js';
document.getElementById('gateCss').textContent = GATE_CSS;
window.__scrOk = true;   // تطبيق «سرعة — الشاشة» يتأكد إن الصفحة اشتغلت (وإلا يطلب تحديث محرك الإنترنت)
const $ = (id) => document.getElementById(id);
// داخل تطبيق التلفزيون: ملء الشاشة من التطبيق، والصوت مسموح بدون لمس
const inApp = /SoraScreenApp/.test(navigator.userAgent);
if (inApp) $('fsBtn').hidden = true;
const P = new URLSearchParams(location.search);
if (P.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

let orders = [], unsub = null, rid = '', day = '', first = true, sound = ls.get('scr_sound', true), audio = null;
// شنو يطلع على الشاشة (يحدده المطعم من إعدادات الكاشير): السفري والبيجر دائماً
let scr = { salon: true, delivery: false }, unsubSet = null;
const seenReady = new Set(), fresh = new Map();   // fresh: رقم ← وقت صار جاهز (للوميض)
const READY_KEEP = 20 * 60000;
const TYPE = { takeaway: 'سفري', salon: 'صالة', delivery: 'دلفري' };

// أي طلب يطلع على الشاشة؟ السفري والبيجر دائماً، والصالة بدون بيجر والدلفري حسب إعدادات المطعم
function where_(o) {
  if (o.status === 'cancelled' || Date.now() - (o.createdAtMs || 0) > 12 * 3600000) return null;
  const t = o.orderType || 'delivery';
  if (t === 'delivery' && (!scr.delivery || ['pickup', 'delivering', 'delivered'].includes(o.status))) return null;   // استلمه الكابتن
  if (t === 'salon' && !o.pager && !scr.salon) return null;
  if (o.servedAtMs || o.pagerDone || (o.held && o.status === 'delivered')) return null;
  if (o.kitchen === 'ready' || o.status === 'ready') {
    const at = o.kitchenReadyAt || o.readyAt || 0;
    return at && Date.now() - at > READY_KEEP ? null : 'ready';
  }
  return o.kitchen === 'new' ? 'prep' : null;
}
const numOf = (o) => String(o.ticketNo || o.salonNum || o.holdNum || String(o.id).slice(0, 4).toUpperCase());

function render() {
  const prep = [], ready = [];
  orders.forEach((o) => { const w = where_(o); if (w === 'prep') prep.push(o); else if (w === 'ready') ready.push(o); });
  prep.sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
  ready.sort((a, b) => (b.kitchenReadyAt || b.readyAt || 0) - (a.kitchenReadyAt || a.readyAt || 0));
  // تنبيه للجاهز الجديد (مو أول تحميل)
  const news = ready.filter((o) => !seenReady.has(o.id));
  news.forEach((o) => { seenReady.add(o.id); if (!first) fresh.set(o.id, Date.now()); });
  if (!first && news.length) announce(news.map(numOf));
  first = false;
  const tile = (o, cls) => {
    const t = TYPE[o.orderType || 'delivery'] || '';
    const flash = cls && fresh.has(o.id) && Date.now() - fresh.get(o.id) < 8000;
    return `<div class="n${cls ? ' ' + cls : ''}${flash ? ' new' : ''}" data-id="${esc(o.id)}"${t && !o.pager ? ` data-t="${t}"` : ''}><span><span class="h">#</span>${esc(numOf(o))}</span>${o.pager ? `<span class="pg">📟 بيجر ${esc(o.pager)}</span>` : ''}</div>`;
  };
  $('ready').innerHTML = ready.map((o, i) => tile(o, i === 0 ? 'feat' : 'r')).join('')
    || '<div class="empty"><b>🍽️</b>ماكو طلبات جاهزة هسه</div>';
  $('prep').innerHTML = prep.map((o) => tile(o, '')).join('') || '<div class="empty"><b>👨‍🍳</b>لا توجد طلبات</div>';
  $('rdN').textContent = ready.length;
  $('ppN').textContent = prep.length;
}

function listen() {
  day = bagDay();
  if (unsub) unsub();
  // اليوم وأمس (المطاعم اللي تشتغل بعد نص الليل) — مساواة بس، ما تحتاج فهارس
  unsub = onSnapshot(query(collection(db, 'orders'), where('restaurantId', '==', rid), where('day', 'in', [day, bagDay(Date.now() - 86400000)])), (s) => {
    orders = s.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }, (e) => { console.warn('orders', e.code); setTimeout(listen, 5000); });
}

// ── الصوت: نغمة + «الطلب رقم ١٢ جاهز» بصوت الجهاز (إذا عنده عربي) ──
function chime() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [660, 880, 1320].forEach((hz, i) => { const o = audio.createOscillator(), g = audio.createGain(), d = audio.currentTime + i * .18; o.connect(g); g.connect(audio.destination); o.type = 'sine'; o.frequency.value = hz;
      g.gain.setValueAtTime(.0001, d); g.gain.exponentialRampToValueAtTime(.4, d + .03); g.gain.exponentialRampToValueAtTime(.0001, d + .4); o.start(d); o.stop(d + .45); });
  } catch (e) {}
}
function speak(nums) {
  try {
    const s = window.speechSynthesis; if (!s) return;
    const v = s.getVoices().find((x) => /^ar/i.test(x.lang)); if (!v) return;
    const u = new SpeechSynthesisUtterance((nums.length > 1 ? 'الطلبات ' : 'الطلب رقم ') + nums.join(' و ') + ' جاهز');
    u.voice = v; u.lang = v.lang; u.rate = .9; s.speak(u);
  } catch (e) {}
}
function announce(nums) { if (!sound) return; chime(); setTimeout(() => speak(nums), 700); }
function soundUi() {
  $('sndIco').textContent = sound ? '🔊' : '🔇';
  $('mSnd').textContent = sound ? '🔊 صوت التنبيه: يشتغل' : '🔇 صوت التنبيه: مطفي';
  $('hint').hidden = !sound || !!(audio && audio.state === 'running');
}
$('hint').onclick = () => { chime(); soundUi(); };
const unlock = () => { if (sound && (!audio || audio.state !== 'running')) { chime(); setTimeout(soundUi, 300); } };
document.addEventListener('click', unlock);
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') unlock(); });   // زر OK بالريموت
if (inApp) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume().then(() => soundUi(), () => {}); } catch (e) {} }

// ── قائمة الإعدادات: الصوت، تحديث، ملء الشاشة، تسجيل خروج — كلها بالريموت ──
const menu = $('menu');
let closeT = null, outArmed = false;
const armClose = () => { clearTimeout(closeT); closeT = setTimeout(() => { if (!menu.hidden) closeMenu(); }, 20000); };
function menuUi() {
  soundUi();
  $('mOut').textContent = outArmed ? '⚠️ متأكد؟ اضغط مرة ثانية للخروج' : '🚪 تسجيل خروج';
  $('mOut').classList.toggle('warn', outArmed);
}
function openMenu() { outArmed = false; menuUi(); menu.hidden = false; $('mSnd').focus(); armClose(); }
function closeMenu() { menu.hidden = true; outArmed = false; clearTimeout(closeT); try { $('menuBtn').focus(); } catch (e) {} }
window.closeScreenMenu = closeMenu;
$('menuBtn').onclick = () => { if (menu.hidden) openMenu(); else closeMenu(); };
$('mSnd').onclick = () => { sound = !sound; ls.set('scr_sound', sound); if (sound) chime(); menuUi(); armClose(); };
$('mReload').onclick = () => location.reload();
$('fsBtn').onclick = () => { const d = document; if (d.fullscreenElement) d.exitFullscreen(); else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {}); closeMenu(); };
$('mOut').onclick = () => {
  if (!outArmed) { outArmed = true; menuUi(); armClose(); return; }
  closeMenu(); logout();
};
$('mClose').onclick = closeMenu;
document.addEventListener('keydown', (e) => {
  if ($('scr').hidden) return;
  const k = e.key;
  if (!menu.hidden) {
    const bs = [].slice.call(menu.querySelectorAll('button')).filter((b) => !b.hidden), i = bs.indexOf(document.activeElement);
    if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); bs[(i + (k === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus(); armClose(); }
    else if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); closeMenu(); }
    return;
  }
  // أي سهم بالريموت يأشّر على زر الإعدادات، و OK يفتحه
  if (/^Arrow/.test(k) && document.activeElement !== $('menuBtn')) { e.preventDefault(); $('menuBtn').focus(); }
});

// الشاشة تبقى شغالة (ما تطفي)
let lock = null;
async function keepOn() { try { if ('wakeLock' in navigator && !document.hidden) lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepOn(); });

function clock() {
  const d = new Date();
  $('clk').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  try { $('dt').textContent = d.toLocaleDateString('ar-IQ-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) {}
}
setInterval(() => { clock(); if (rid) { if (bagDay() !== day) listen(); else render(); } }, 30000);

// ── التحديث التلقائي: أي تحديث للشاشة يوصل للتلفزيون وحده بدون ما أحد يلمس شي ──
//  نراقب ملفات الصفحة كل دقيقة؛ إذا تغيّرت (ونتأكد مرتين) نحدّث بلحظة هادئة — مو وقت ما رقم جديد يومض
(() => {
  const AU_MS = window.__auMs || 60000, files = ['screen.html', 'staff.js'];
  let base = null, cand = null;
  const sig = (r) => r.headers.get('last-modified') || (r.headers.get('etag') || '').replace(/^W\//, '');
  const quiet = () => ![...fresh.values()].some((t) => Date.now() - t < 15000) && menu.hidden;
  async function check() {
    if (!navigator.onLine) return;
    try {
      const rs = await Promise.all(files.map((f) => fetch(f + '?au=' + Date.now(), { method: 'HEAD', cache: 'no-store' })));
      if (rs.some((r) => !r.ok)) return;
      const s = rs.map(sig).join('|');
      if (!s.replace(/\|/g, '')) return;
      if (base === null) { base = s; return; }
      if (s === base) { cand = null; return; }
      if (cand !== s) { cand = s; return; }
      if (quiet()) location.reload();
    } catch (e) {}
  }
  setTimeout(check, Math.min(5000, AU_MS)); setInterval(check, AU_MS);
  // وتحديث يومي الساعة ٥ الصبح بتوقيت بغداد: ذاكرة التلفزيون تبقى نظيفة لو بقى شغّال أيام
  const started = Date.now();
  setInterval(() => {
    if (new Date(Date.now() + 3 * 3600000).getUTCHours() === 5 && Date.now() - started > 3 * 3600000 && quiet()) location.reload();
  }, 60000);
})();

function setName(name) {
  $('nm').textContent = name; document.title = 'طلبك جاهز — ' + name;
  // حرف الشعار: أول حرف من الاسم بدون «مطعم/كافيه…» وبدون «ال»
  const w = String(name).trim().replace(/^(مطعم|مطاعم|كافيه|كافي|مشويات|مقهى)\s+/, '').split(/\s+/)[0].replace(/^ال(?=..)/, '');
  $('mk').textContent = w[0] || 'س';
}
staffGate($('gate'), {
  title: 'شاشة «طلبك جاهز»', sub: 'افتحها على تلفزيون أو تابلت قدام الزبائن — سجّل دخول بحساب المطعم',
  onIn: async (u) => {
    rid = u.rid; first = true; seenReady.clear();
    const name0 = u.rest.name || '';
    setName(name0);
    // الإعدادات مباشرة: أي تغيير من الكاشير ينطبق على الشاشة فوراً
    if (unsubSet) unsubSet();
    unsubSet = onSnapshot(doc(db, 'restaurants', rid, 'settings', 'main'), (s) => {
      const d = s.exists() ? s.data() : {};
      scr = { salon: true, delivery: false, ...(d.screen || {}) };
      setName(d.receiptTitle || name0);
      render();
    }, () => {});
    $('scr').hidden = false; clock(); soundUi(); keepOn(); listen();
  },
  onOut: () => {
    if (unsub) { unsub(); unsub = null; } if (unsubSet) { unsubSet(); unsubSet = null; }
    rid = ''; orders = []; $('scr').hidden = true; $('hint').hidden = true; menu.hidden = true;
  },
});
</script>
